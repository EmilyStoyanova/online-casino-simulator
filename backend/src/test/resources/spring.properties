# Spring TestContext cache (W3-09, docs/plans/week-03.md §7.12).
# Every cached application context keeps its own Testcontainers PostgreSQL container running
# (TestcontainersConfiguration). With the default of 32, all ~16 distinct test configurations stay
# cached, and a full `./mvnw verify` ends with 17 containers running at the same time. Evicting the
# least recently used context closes it and stops its container, which bounds Docker's load.
# Tests and their data are unaffected: each context still has its own database.
spring.test.context.cache.maxSize=6
