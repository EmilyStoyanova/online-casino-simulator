openapi: 3.1.0

# -----------------------------------------------------------------------------
# Online Casino Simulator — API contract (design-first).
#
# This file is the SOURCE OF TRUTH for the HTTP API:
#   1. Change the contract here first (new path, field, status code, ...).
#   2. Implement it in a controller + DTO.
#   3. `OpenApiContractIT` fails until the implementation matches the contract.
#
# Designed but not yet implemented operations and schema properties carry
# `x-implementation-status: planned` (operations also get the summary suffix "(planned)").
# Enum values designed ahead of their implementation are listed in the schema's
# `x-planned-enum-values`.
# The contract tests skip them while they are not implemented and fail as soon as an
# implementation exists, so the marker is removed in the same change as the implementation.
#
# Served at /openapi.yaml and shown first in Swagger UI (/swagger-ui.html).
# -----------------------------------------------------------------------------

info:
  title: Online Casino Simulator API
  version: 0.5.0
  summary: Casino rules and probabilities with virtual currency only.
  description: |
    REST API of the Online Casino Simulator.

    The platform uses **virtual currency only**: there are no real-money deposits,
    withdrawals, purchases of virtual currency or cash-equivalent prizes.

    ## Conventions
    - Base path for business endpoints: `/api/v1`; administrative endpoints will use `/api/v1/admin/**`.
    - Request and response bodies are JSON.
    - Errors are returned as [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) Problem Details
      (`application/problem+json`, schema `ProblemDetail`) with a stable `code` and
      `Cache-Control: no-store`. Clients decide on `code`, never on `title` or `detail`.
    - The following errors can occur on every operation and are not repeated per operation:
      unknown path `404 NOT_FOUND` (without a session, an unknown path under `/api/` returns
      `401 AUTHENTICATION_REQUIRED`, because access is denied by default), a missing or invalid
      CSRF token on an unsafe method `403 CSRF_TOKEN_INVALID`, unsupported method
      `405 METHOD_NOT_ALLOWED`, an `Accept` header that no representation matches
      `406 NOT_ACCEPTABLE`, an unsupported request `Content-Type`
      `415 UNSUPPORTED_MEDIA_TYPE`, an unreadable request `400 MALFORMED_REQUEST` and an unexpected
      failure `500 INTERNAL_ERROR`. Any other error status is kept and reported with a generic code
      (see `ProblemDetail.code`). Error responses never contain stack traces, exception messages,
      SQL or class names. Only a cross-origin request from an origin that is not allowed is
      rejected by the CORS check with a plain-text `403` (`Invalid CORS request`).
    - Timestamps are ISO-8601 in UTC (`date-time`).
    - Virtual coins are JSON integers (`int64`), never fractions. Balances are between `0` and
      `9007199254740991` (2^53 − 1), so every value is exact in JavaScript (`Number.MAX_SAFE_INTEGER`).
    - Operations whose summary ends with "(planned)" (`x-implementation-status: planned`) are
      designed and reviewed, but not available yet. Enum values listed in a schema's
      `x-planned-enum-values` are designed, but not returned yet.

    ## Authentication
    - Server-side sessions: registration and login set an `HttpOnly` session
      cookie (security scheme `sessionCookie`). There are no tokens in browser storage.
    - CSRF protection (security scheme `csrfHeader`): every `POST`, `PUT`, `PATCH` and `DELETE`
      request, including login and registration, sends the `XSRF-TOKEN` cookie value in the
      `X-XSRF-TOKEN` header. The token is obtained with `GET /api/v1/auth/csrf` at start-up and
      again after registration, login and logout. On `403` with code `CSRF_TOKEN_INVALID` the
      client fetches a new token and retries once.
    - Operations with `security: []` are public. All other operations require a session;
      without one they return `401 AUTHENTICATION_REQUIRED`, or `401 SESSION_EXPIRED` when the
      session cookie refers to a session that has ended.
    - Roles (`UserRole`): `PLAYER` for every registered user, `ADMIN` only for administrators
      created from server configuration. The role is taken from the account when signing in, never
      from a request. Administrative operations under `/api/v1/admin/**` (from Week 10) require
      `ADMIN`: other signed-in users get `403 ACCESS_DENIED` for every path there, also unknown
      ones. Player operations under `/api/v1/wallet/**` and `/api/v1/games/**` require `PLAYER`:
      administrators have no wallet and get `403 ACCESS_DENIED`. A role change applies from the
      next sign-in.

    ## Virtual wallet
    - Every player has exactly one wallet, opened with the starting balance when the account is
      registered. The wallet is always the one of the session's user: no operation takes a wallet
      or user id, so no client can read another user's wallet.
    - The wallet operations only **read** wallets. Balances change on the server alone, as the
      result of game, learning or reward rules: a roulette spin (`POST /api/v1/games/roulette/spins`,
      planned) debits its stake and credits its payout. No operation credits or debits a wallet
      directly, and no request can set a balance or an amount to credit.
    - Every balance change is an entry in an append-only ledger (`WalletTransaction`). Entries are
      never changed or deleted.

    ## European roulette (planned)
    - Single-zero wheel with the numbers 0–36; the server draws every result with a
      cryptographically secure random number generator, each number with probability exactly
      1/37. No request can choose, preview or influence a result or a payout.
    - Five bet categories (`RouletteBetCategory`), each with its own option: straight number,
      red/black, even/odd, low/high and dozens. Zero is green, neither even nor odd, neither low
      nor high and in no dozen: it loses every category except a straight bet on `0`.
    - Standard payouts, quoted as **net winnings** (odds) on a winning bet: straight 35:1,
      red/black, even/odd and low/high 1:1, dozens 2:1. A winning bet returns its stake plus the
      net winnings (`payout`: 36×, 2× or 3× the amount); a losing bet returns nothing.
    - Every bet has the same expected net result of −1/37 of its amount: the house edge is
      1/37 ≈ 2.7027 % and the theoretical return to player (RTP) is 36/37 ≈ 97.2973 %. Single
      rounds vary widely around these long-run averages.
    - One request plays exactly one round. There is no autoplay, repeat or bonus mechanic.
  license:
    name: Proprietary — SAP mentorship project

servers:
  - url: /
    description: Same origin as the frontend (in development via the Vite proxy)

tags:
  - name: System
    description: Platform status
  - name: Authentication
    description: CSRF token, registration, login and logout
  - name: Users
    description: Profile of the signed-in user
  - name: Interests
    description: Catalog of educational interests
  - name: Wallet
    description: Virtual-coin balance and transaction history of the signed-in player (read-only)
  - name: Roulette
    description: European roulette rounds of the signed-in player, played with virtual coins
  - name: Operations
    description: Infrastructure health probes provided by Spring Boot Actuator

paths:
  /api/v1/system/status:
    get:
      tags: [System]
      operationId: getSystemStatus
      summary: Get platform status
      description: |
        Reports the application version and whether the database is reachable, including the
        latest applied database migration. Public, no authentication.
      security: []
      responses:
        '200':
          description: Platform is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
              example:
                application: online-casino-simulator
                version: 0.1.0-SNAPSHOT
                status: UP
                database:
                  status: UP
                  schemaVersion: '5'
                timestamp: '2026-10-29T10:15:30.123Z'
        '503':
          description: Platform is unavailable (database unreachable). The body still describes the status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
              example:
                application: online-casino-simulator
                version: 0.1.0-SNAPSHOT
                status: DOWN
                database:
                  status: DOWN
                  schemaVersion: null
                timestamp: '2026-10-29T10:15:30.123Z'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Issue a CSRF token
      description: |
        Sets the `XSRF-TOKEN` cookie, which JavaScript can read. Its value is sent
        in the `X-XSRF-TOKEN` header with every unsafe request. Call it at start-up and again after
        registration, login and logout, because these delete the `XSRF-TOKEN` cookie. Public.
      security: []
      responses:
        '204':
          description: Token cookie set
          headers:
            Set-Cookie:
              description: '`XSRF-TOKEN=<token>; Path=/` (readable by JavaScript; `Secure` over HTTPS)'
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Register a player account and sign in
      description: |
        Creates a `PLAYER` account and signs the new user in: a new session id is issued and the
        `XSRF-TOKEN` cookie is deleted, so the client fetches a new token with `GET /api/v1/auth/csrf`. The
        email is trimmed and lower-cased before it is checked and stored. `adultConfirmed` must be
        `true`; the confirmation time is taken from the server clock. Properties that are not in
        `RegisterRequest` (for example `role`) are ignored. All invalid properties are reported
        together in one `400 VALIDATION_FAILED`.

        Public, but requires a CSRF token. At most 10 registration attempts per client IP and hour:
        every request that passes the CSRF check counts, whatever its outcome (`201`, `400`, `409`).
        The limit is checked before the body is read, so a throttled client gets `429` even for an
        invalid request.

        Registration can be closed by server configuration (for example on a staging deployment);
        no request can open it. While it is closed, every request that passes the CSRF check gets
        `403 REGISTRATION_DISABLED`: before the body is read and without counting an attempt. Login,
        logout and existing sessions are not affected.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: alice@example.com
              password: correct-horse-battery
              displayName: Alice
              adultConfirmed: true
      responses:
        '201':
          description: Account created; the user is signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                id: 0b8f0c2e-5f3a-4c55-9d8e-2f6c1a7e9b10
                email: alice@example.com
                displayName: Alice
                role: PLAYER
                interests: []
                adultConfirmedAt: '2026-11-02T09:15:00Z'
                createdAt: '2026-11-02T09:15:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: |
            The `X-XSRF-TOKEN` header is missing or does not match the `XSRF-TOKEN` cookie
            (`CSRF_TOKEN_INVALID`), or registration is closed (`REGISTRATION_DISABLED`).
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                csrfTokenInvalid:
                  value:
                    title: Forbidden
                    status: 403
                    code: CSRF_TOKEN_INVALID
                    detail: The CSRF token is missing or invalid.
                    instance: /api/v1/auth/register
                registrationDisabled:
                  value:
                    title: Forbidden
                    status: 403
                    code: REGISTRATION_DISABLED
                    detail: New registrations are currently closed.
                    instance: /api/v1/auth/register
        '409':
          description: The email is already registered
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                title: Conflict
                status: 409
                code: EMAIL_ALREADY_REGISTERED
                detail: An account with this email already exists.
                instance: /api/v1/auth/register
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Sign in
      description: |
        Signs the user in with email and password. The email is trimmed and lower-cased. On success
        a new session id is issued (session-fixation protection) and the `XSRF-TOKEN` cookie is
        deleted, so the client fetches a new token with `GET /api/v1/auth/csrf`. The session ends
        after 30 minutes of inactivity or 12 hours after sign-in.

        Every failure (unknown email, wrong password, disabled account) returns the same `401` with
        code `INVALID_CREDENTIALS`. Failed logins are throttled per account and client IP
        (5 per 15 minutes) and per client IP (50 per 15 minutes) with `429`; the limit is checked
        before the password, and the response is the same for existing and unknown accounts.
        Accounts are never locked; a successful login resets the account and IP counter. Public, but
        requires a CSRF token.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: alice@example.com
              password: correct-horse-battery
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Sign-in failed. The response does not reveal whether the account exists.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                title: Unauthorized
                status: 401
                code: INVALID_CREDENTIALS
                detail: The email or password is incorrect.
                instance: /api/v1/auth/login
        '403':
          $ref: '#/components/responses/CsrfTokenInvalid'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Sign out
      description: |
        Ends the session: the stored session is deleted, the session cookie expires and the
        `XSRF-TOKEN` cookie is deleted, so the client fetches a new token with
        `GET /api/v1/auth/csrf`. The old session cookie is rejected afterwards
        (`401 SESSION_EXPIRED`). Also returns `204` without a session (idempotent). Requires a CSRF
        token.
      security:
        - csrfHeader: []
      responses:
        '204':
          description: Signed out (or no session existed)
          headers:
            Set-Cookie:
              description: Expires the session cookie and the `XSRF-TOKEN` cookie
              schema:
                type: string
        '403':
          $ref: '#/components/responses/CsrfTokenInvalid'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get the signed-in user's profile
      description: |
        Returns the profile of the user who owns the session; the user is identified only by the
        session, never by a request value. The SPA also calls it at start-up to find out whether a
        user is signed in (`401` means anonymous). Does not extend the session's 12-hour lifetime.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Profile of the signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                id: 0b8f0c2e-5f3a-4c55-9d8e-2f6c1a7e9b10
                email: alice@example.com
                displayName: Alice
                role: PLAYER
                interests: [PROBABILITY, MATHEMATICS]
                adultConfirmedAt: '2026-11-02T09:15:00Z'
                createdAt: '2026-11-02T09:15:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Users]
      operationId: updateCurrentUser
      summary: Update the signed-in user's profile
      description: |
        Partial update of the signed-in user's display name and/or interests. Omitted properties are
        left unchanged, and so are properties sent as `null`; `{}` changes nothing.
        `interests` replaces the whole selection: 0–8 distinct codes of active interests
        (`GET /api/v1/interests`); an unknown or inactive code is reported as `VALIDATION_FAILED`
        for its position, e.g. `interests[2]`. Email, role, status and the 18+ confirmation cannot
        be changed: such properties are ignored. All changes are saved together or not at all.
        Requires a session and a CSRF token.

        A request that overlaps with another change of the same profile fails with
        `409 CONCURRENT_MODIFICATION` instead of overwriting it; the client reloads the profile and
        tries again. Requests that do not overlap are applied in order (the last one wins).
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              displayName: Alice B.
              interests: [PROBABILITY, STATISTICS]
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfTokenInvalid'
        '409':
          description: The profile was changed concurrently; reload it and try again
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                title: Conflict
                status: 409
                code: CONCURRENT_MODIFICATION
                detail: The profile was changed by another request. Reload it and try again.
                instance: /api/v1/users/me
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/interests:
    get:
      tags: [Interests]
      operationId: listInterests
      summary: List the educational interests
      description: |
        Active interests in display order (the order is stable; codes never change). Users choose
        0–8 of them in their profile. Public: works with and without a session, and creates none.
      security: []
      responses:
        '200':
          description: Active interests in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Interest'
              example:
                - code: PROBABILITY
                  name: Probability & odds
                  description: How likely outcomes are and how odds are expressed
                - code: MATHEMATICS
                  name: Mathematics of games
                  description: Expected value, house edge and variance
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/wallet:
    get:
      tags: [Wallet]
      operationId: getWallet
      summary: Get the signed-in player's wallet
      description: |
        Returns the current virtual-coin balance of the wallet that belongs to the session's user.
        The wallet is identified only by the session, never by a request value. Read-only: it never
        creates or changes a wallet. Players only: an administrator gets `403 ACCESS_DENIED`.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Wallet of the signed-in player
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
              example:
                balance: 1000
                updatedAt: '2026-11-12T09:15:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PlayerRoleRequired'
        '500':
          $ref: '#/components/responses/WalletInternalError'

  /api/v1/wallet/transactions:
    get:
      tags: [Wallet]
      operationId: listWalletTransactions
      summary: List the signed-in player's wallet transactions
      description: |
        Ledger entries of the session user's wallet, newest first, in pages (keyset pagination).
        The first request has no `cursor`; each further page is requested with the `nextCursor` of
        the previous response, and the same `limit`. `nextCursor` is `null` on the last page.

        The order is stable: entries are ordered by `id`, descending, and new entries only ever
        get higher ids. Following `nextCursor` therefore never repeats or skips an entry, also when
        new entries are added between two requests (they appear on a new first page). Ids can
        have gaps; they are not consecutive.

        The cursor is opaque: clients pass it back unchanged and never build or parse it. It only
        selects entries of the session user's wallet. Players only: an administrator gets
        `403 ACCESS_DENIED`.
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of entries in the page.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the previous page; omitted for the first page.
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: '^[A-Za-z0-9_-]+$'
      responses:
        '200':
          description: One page of ledger entries, newest first
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactionPage'
              examples:
                firstPage:
                  summary: A new player's only entry
                  value:
                    items:
                      - id: 1
                        type: STARTING_BALANCE
                        amount: 1000
                        balanceAfter: 1000
                        createdAt: '2026-11-12T09:15:00Z'
                    nextCursor: null
        '400':
          description: |
            Invalid page request. `VALIDATION_FAILED`: `limit` is outside 1–100, or `cursor` is not a
            cursor issued by this API (the field is named in `errors`). `MALFORMED_REQUEST`: `limit`
            is not an integer.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                limitOutOfRange:
                  value:
                    title: Bad Request
                    status: 400
                    code: VALIDATION_FAILED
                    detail: The request contains invalid values.
                    instance: /api/v1/wallet/transactions
                    errors:
                      - field: limit
                        message: must be less than or equal to 100
                invalidCursor:
                  value:
                    title: Bad Request
                    status: 400
                    code: VALIDATION_FAILED
                    detail: The request contains invalid values.
                    instance: /api/v1/wallet/transactions
                    errors:
                      - field: cursor
                        message: is not a valid cursor
                malformedLimit:
                  value:
                    title: Bad Request
                    status: 400
                    code: MALFORMED_REQUEST
                    detail: The request could not be read.
                    instance: /api/v1/wallet/transactions
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PlayerRoleRequired'
        '500':
          $ref: '#/components/responses/WalletInternalError'

  /api/v1/games/roulette/spins:
    post:
      tags: [Roulette]
      operationId: spinRoulette
      summary: Place bets and spin the European roulette wheel (planned)
      x-implementation-status: planned
      description: |
        Plays one round for the session's player: validates the bets, debits their total stake from
        the player's wallet, draws the winning number on the server, evaluates every bet and credits
        the total payout. Stake, result, payout, round and bets are stored in **one** database
        transaction: either all of it happens or nothing does. The result is sent only after it has
        been stored.

        **The request contains bets only.** The player comes from the session; the winning number,
        the payouts and the resulting balance are always computed by the server. Properties that are
        not in `RouletteSpinRequest` (for example `winningNumber`, `payout`, `balance` or `userId`)
        are ignored and never influence the round.

        **Bets** (`RouletteBet`): 1–10 per spin, each with a whole-coin `amount` of 1–1,000, so the
        total stake is 1–10,000 coins. The same selection (category and option) at most once per
        spin. Amounts and numbers must be JSON integers written without a fraction or exponent:
        `10.5`, `10.0`, `1e1` or `"10"` are rejected with `400 MALFORMED_REQUEST`, never rounded or
        converted. The total stake must not exceed the current balance (`409 INSUFFICIENT_FUNDS`);
        this is checked while the wallet is locked, so parallel spins cannot spend the same coins.

        **Idempotency.** Every spin attempt sends a new UUID in `Idempotency-Key` and reuses it for
        every retry of that attempt (for example after a timeout). Keys are scoped to the player:
        - The first request with a key that passes validation plays the round.
        - A later request with the same key and the **same content** returns the original result
          (same `roundId`, winning number, payouts and `balance`) with `200`. Nothing is debited,
          credited, drawn or stored again, even if the balance has changed since. Same content means
          the same bets as a set: the same category, option and amount for every bet, whatever the
          bet order, JSON formatting, property order or ignored properties; an option property sent as
          `null` counts as omitted. The response lists the bets in the order of the original request.
        - The same key with **different content** → `409 IDEMPOTENCY_KEY_REUSED`; nothing changes.
          A new spin needs a new key.
        - Requests with the same key at the same time are processed one after the other: one plays
          the round, the others return its result.
        - A request that fails (`400`, `409`, `500`, `503`) stores nothing, so its key is not used up.
          Validation (`400`) happens before the key is looked up.

        **Responsible play.** One request plays exactly one round; there is no autoplay or repeat.
        The response shows every stake and payout, and the wallet history shows the stake and the
        payout as separate entries (`ROULETTE_STAKE`, `ROULETTE_PAYOUT`).

        Players only (an administrator gets `403 ACCESS_DENIED`). Requires a session and a CSRF
        token.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            UUID chosen by the client for this spin attempt, in the canonical 36-character form
            (`8-4-4-4-12` hexadecimal digits, case-insensitive). Reused unchanged for retries of the
            same attempt; a new spin needs a new key. Missing or not a canonical UUID →
            `400 MALFORMED_REQUEST`.
          schema:
            type: string
            format: uuid
            minLength: 36
            maxLength: 36
            pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
          example: 3f2b8c4e-9d1a-4e7b-8c2f-5a6d7e8f9a0b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouletteSpinRequest'
            examples:
              straightAndColor:
                summary: A straight bet on 17 and a bet on red
                value:
                  bets:
                    - category: STRAIGHT
                      number: 17
                      amount: 10
                    - category: RED_BLACK
                      color: RED
                      amount: 20
              everyCategory:
                summary: One bet of every category
                value:
                  bets:
                    - category: STRAIGHT
                      number: 0
                      amount: 5
                    - category: RED_BLACK
                      color: BLACK
                      amount: 10
                    - category: EVEN_ODD
                      parity: EVEN
                      amount: 10
                    - category: LOW_HIGH
                      range: HIGH
                      amount: 10
                    - category: DOZEN
                      dozen: SECOND
                      amount: 15
      responses:
        '200':
          description: |
            The round was played, or the same request (same key and content) was already played and
            its original result is returned.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouletteSpinResult'
              examples:
                win:
                  summary: 17 (black) wins the straight bet; red loses
                  value:
                    roundId: 6f1c2a0e-8b3d-4c55-9a7e-2f0d5b1e9c41
                    winningNumber: 17
                    winningColor: BLACK
                    bets:
                      - category: STRAIGHT
                        number: 17
                        amount: 10
                        payout: 360
                      - category: RED_BLACK
                        color: RED
                        amount: 20
                        payout: 0
                    totalStake: 30
                    totalPayout: 360
                    balance: 1330
                    createdAt: '2026-11-20T10:15:30.123456Z'
                zero:
                  summary: Zero wins the straight bet on 0; even loses
                  value:
                    roundId: 0d9e8f7a-6b5c-4d3e-8f1a-2b3c4d5e6f70
                    winningNumber: 0
                    winningColor: GREEN
                    bets:
                      - category: STRAIGHT
                        number: 0
                        amount: 5
                        payout: 180
                      - category: EVEN_ODD
                        parity: EVEN
                        amount: 10
                        payout: 0
                    totalStake: 15
                    totalPayout: 180
                    balance: 1165
                    createdAt: '2026-11-20T10:16:02.654321Z'
                loss:
                  summary: Nothing won; only the stake is debited
                  value:
                    roundId: 9a8b7c6d-5e4f-4a3b-9c2d-1e0f9a8b7c6d
                    winningNumber: 8
                    winningColor: BLACK
                    bets:
                      - category: DOZEN
                        dozen: THIRD
                        amount: 50
                        payout: 0
                    totalStake: 50
                    totalPayout: 0
                    balance: 950
                    createdAt: '2026-11-20T10:17:45.000001Z'
        '400':
          description: |
            Invalid request; nothing was changed and no number was drawn.

            `VALIDATION_FAILED` (the fields are named in `errors`, rejected values are never echoed):
            no bets or more than 10 (`bets`); the same selection twice (`bets`); an `amount` outside
            1–1,000 (`bets[i].amount`); a missing option or a `number` outside 0–36 (e.g.
            `bets[i].number`, `bets[i].color`); an option property that does not belong to the bet's
            category (e.g. `bets[i].dozen` on a `RED_BLACK` bet).

            `MALFORMED_REQUEST`: missing `Idempotency-Key` or one that is not a canonical UUID;
            missing, unreadable or non-JSON-object body; an unknown `category` or option value (e.g.
            `"color": "GREEN"`); a wrong JSON type; an amount or number with a fraction or exponent,
            or written as a string.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                amountOutOfRange:
                  value:
                    title: Bad Request
                    status: 400
                    code: VALIDATION_FAILED
                    detail: The request contains invalid values.
                    instance: /api/v1/games/roulette/spins
                    errors:
                      - field: bets[0].amount
                        message: must be less than or equal to 1000
                tooManyBets:
                  value:
                    title: Bad Request
                    status: 400
                    code: VALIDATION_FAILED
                    detail: The request contains invalid values.
                    instance: /api/v1/games/roulette/spins
                    errors:
                      - field: bets
                        message: size must be between 1 and 10
                missingOption:
                  value:
                    title: Bad Request
                    status: 400
                    code: VALIDATION_FAILED
                    detail: The request contains invalid values.
                    instance: /api/v1/games/roulette/spins
                    errors:
                      - field: bets[1].color
                        message: must not be null
                malformed:
                  summary: Missing or invalid Idempotency-Key, unknown category, fractional amount
                  value:
                    title: Bad Request
                    status: 400
                    code: MALFORMED_REQUEST
                    detail: The request could not be read.
                    instance: /api/v1/games/roulette/spins
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            The `X-XSRF-TOKEN` header is missing or does not match the `XSRF-TOKEN` cookie
            (`CSRF_TOKEN_INVALID`, checked first), or the signed-in user is not a player
            (`ACCESS_DENIED`): administrators have no wallet.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                csrfTokenInvalid:
                  value:
                    title: Forbidden
                    status: 403
                    code: CSRF_TOKEN_INVALID
                    detail: The CSRF token is missing or invalid.
                    instance: /api/v1/games/roulette/spins
                accessDenied:
                  value:
                    title: Forbidden
                    status: 403
                    code: ACCESS_DENIED
                    detail: You are not allowed to perform this action.
                    instance: /api/v1/games/roulette/spins
        '409':
          description: |
            The spin conflicts with the state of the wallet or with an earlier request; nothing was
            changed and no number was drawn. `INSUFFICIENT_FUNDS`: the total stake is larger than the
            current balance. `IDEMPOTENCY_KEY_REUSED`: the `Idempotency-Key` was already used for a
            spin with different content; use a new key. `BALANCE_LIMIT_EXCEEDED`: the payout would
            take the balance beyond 2^53 − 1 (practically unreachable); the whole round is undone.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                insufficientFunds:
                  value:
                    title: Conflict
                    status: 409
                    code: INSUFFICIENT_FUNDS
                    detail: The virtual balance is too low for this action.
                    instance: /api/v1/games/roulette/spins
                idempotencyKeyReused:
                  value:
                    title: Conflict
                    status: 409
                    code: IDEMPOTENCY_KEY_REUSED
                    detail: This request was already processed with different values.
                    instance: /api/v1/games/roulette/spins
                balanceLimitExceeded:
                  value:
                    title: Conflict
                    status: 409
                    code: BALANCE_LIMIT_EXCEEDED
                    detail: The virtual balance would exceed its maximum.
                    instance: /api/v1/games/roulette/spins
        '500':
          description: |
            Unexpected error; the details are only logged on the server. This includes a player
            account without a wallet (a data error). Nothing was changed: the whole round was undone,
            so a retry with the same `Idempotency-Key` plays it.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                title: Internal Server Error
                status: 500
                code: INTERNAL_ERROR
                detail: An unexpected error occurred. Please try again later.
                instance: /api/v1/games/roulette/spins
        '503':
          description: |
            The wallet stayed locked by another operation for longer than the server's lock timeout
            (`SERVICE_UNAVAILABLE`). Nothing was changed; retry with the **same** `Idempotency-Key`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                title: Service Unavailable
                status: 503
                code: SERVICE_UNAVAILABLE
                detail: The service is temporarily unavailable. Please try again later.
                instance: /api/v1/games/roulette/spins

  /actuator/health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Aggregated health
      description: Health of the application including its health groups. Returns `503` when not healthy.
      security: []
      responses:
        '200':
          description: Application is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: UP
                groups: [liveness, readiness]
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Application is not healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /actuator/health/liveness:
    get:
      tags: [Operations]
      operationId: getLiveness
      summary: Liveness probe
      description: Whether the process is alive. Used by the hosting platform to restart the container.
      security: []
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: UP
        '503':
          description: Not alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /actuator/health/readiness:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Readiness probe
      description: Whether the application is ready to accept traffic.
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: UP
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /actuator/info:
    get:
      tags: [Operations]
      operationId: getInfo
      summary: Application info
      description: Build and application information (currently empty).
      security: []
      responses:
        '200':
          description: Application info
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example: {}

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: |
        Server-side session (Spring Session JDBC). The cookie is `HttpOnly`, `SameSite=Lax`, `Path=/`
        and has no `Domain`. In production it is named `__Host-SESSION` and is `Secure`. Issued by
        registration and login; it ends with logout, after 30 minutes of inactivity or
        12 hours after sign-in. The browser sends it automatically. A request whose
        session has ended gets `401 SESSION_EXPIRED` on protected operations.
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: |
        CSRF token (Spring Security SPA pattern): the value of the `XSRF-TOKEN` cookie from
        `GET /api/v1/auth/csrf`, sent with every `POST`, `PUT`, `PATCH` and `DELETE`. It is checked
        on every unsafe request, including public ones; without it the response is
        `403 CSRF_TOKEN_INVALID`.

  headers:
    NoStore:
      description: |
        Contains `no-store`, so errors and personal data are never cached. Error responses send
        `no-store`; other responses get Spring Security's default.
      schema:
        type: string
        examples: ['no-store', 'no-cache, no-store, max-age=0, must-revalidate']
    SessionCookie:
      description: |
        Session cookie with a new session id, e.g. `SESSION=<id>; Path=/; HttpOnly; SameSite=Lax`
        (`__Host-SESSION=<id>; Path=/; Secure; HttpOnly; SameSite=Lax` in production).
      schema:
        type: string
    RetryAfter:
      description: Seconds until the current throttling window ends.
      schema:
        type: integer
        format: int32
        minimum: 1

  responses:
    InternalError:
      description: Unexpected error; the details are only logged on the server
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            title: Internal Server Error
            status: 500
            code: INTERNAL_ERROR
            detail: An unexpected error occurred. Please try again later.
            instance: /api/v1/system/status
    BadRequest:
      description: |
        The request is invalid. `VALIDATION_FAILED` lists the invalid properties in `errors` (rejected
        values are never echoed); `MALFORMED_REQUEST` means the request could not be read (malformed
        JSON, a wrong JSON type, a missing body or an invalid parameter).
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            validationFailed:
              value:
                title: Bad Request
                status: 400
                code: VALIDATION_FAILED
                detail: The request contains invalid values.
                instance: /api/v1/auth/register
                errors:
                  - field: password
                    message: must be at least 12 characters long
                  - field: adultConfirmed
                    message: must be true
            malformedRequest:
              value:
                title: Bad Request
                status: 400
                code: MALFORMED_REQUEST
                detail: The request could not be read.
                instance: /api/v1/auth/register
    Unauthenticated:
      description: |
        No valid session. `AUTHENTICATION_REQUIRED`: the request had no session cookie.
        `SESSION_EXPIRED`: the session cookie refers to a session that has ended (inactivity, maximum
        lifetime or logout).
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            authenticationRequired:
              value:
                title: Unauthorized
                status: 401
                code: AUTHENTICATION_REQUIRED
                detail: Sign in to continue.
                instance: /api/v1/users/me
            sessionExpired:
              value:
                title: Unauthorized
                status: 401
                code: SESSION_EXPIRED
                detail: Your session has ended. Sign in again.
                instance: /api/v1/users/me
    CsrfTokenInvalid:
      description: The `X-XSRF-TOKEN` header is missing or does not match the `XSRF-TOKEN` cookie.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            title: Forbidden
            status: 403
            code: CSRF_TOKEN_INVALID
            detail: The CSRF token is missing or invalid.
            instance: /api/v1/auth/login
    TooManyAttempts:
      description: Too many attempts from this client; try again after `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            title: Too Many Requests
            status: 429
            code: TOO_MANY_ATTEMPTS
            detail: Too many attempts. Try again later.
            instance: /api/v1/auth/login
    PlayerRoleRequired:
      description: |
        Signed in, but not as a player (`ACCESS_DENIED`): administrators have no wallet.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            title: Forbidden
            status: 403
            code: ACCESS_DENIED
            detail: You are not allowed to perform this action.
            instance: /api/v1/wallet
    WalletInternalError:
      description: |
        Unexpected error; the details are only logged on the server. This includes a player
        account without a wallet, which the server treats as a data error: a read never creates a
        wallet.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            title: Internal Server Error
            status: 500
            code: INTERNAL_ERROR
            detail: An unexpected error occurred. Please try again later.
            instance: /api/v1/wallet

  schemas:
    ComponentStatus:
      type: string
      description: Availability of the platform or one of its dependencies.
      enum: [UP, DOWN]

    SystemStatus:
      type: object
      description: Platform status and database connectivity.
      required: [application, version, status, database, timestamp]
      properties:
        application:
          type: string
          description: Application name
          examples: [online-casino-simulator]
        version:
          type: string
          description: Application version
          examples: [0.1.0-SNAPSHOT]
        status:
          $ref: '#/components/schemas/ComponentStatus'
        database:
          $ref: '#/components/schemas/DatabaseStatus'
        timestamp:
          type: string
          format: date-time
          description: Time the status was determined (UTC)

    DatabaseStatus:
      type: object
      required: [status, schemaVersion]
      properties:
        status:
          $ref: '#/components/schemas/ComponentStatus'
        schemaVersion:
          type: [string, 'null']
          description: Latest applied Flyway migration version; `null` when the database is unreachable.
          examples: ['1']

    RegisterRequest:
      type: object
      description: New player account. Properties not listed here are ignored.
      required: [email, password, displayName, adultConfirmed]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: |
            Trimmed and lower-cased by the server before it is checked and stored. Only ASCII
            characters are accepted.
          examples: [alice@example.com]
        password:
          type: string
          minLength: 12
          maxLength: 72
          writeOnly: true
          description: |
            At least 12 characters and at most 72 bytes in UTF-8 (longer passwords are rejected,
            never truncated). Must not equal the email or the display name (ignoring case) and must
            not be a commonly used password (server-side denylist, ignoring case). Stored only as a
            BCrypt hash.
        displayName:
          type: string
          minLength: 3
          maxLength: 30
          description: Trimmed by the server before it is checked and stored; no control characters.
          examples: [Alice]
        adultConfirmed:
          type: boolean
          description: Confirms that the user is at least 18 years old. Must be `true`.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          examples: [alice@example.com]
        password:
          type: string
          minLength: 1
          writeOnly: true

    UpdateProfileRequest:
      type: object
      description: |
        Partial profile update. Omitted properties and properties sent as `null` are left
        unchanged; `null` never clears a value. Properties not listed here (for example `email` or
        `role`) are ignored.
      properties:
        displayName:
          type: string
          minLength: 3
          maxLength: 30
          description: Trimmed by the server before it is checked and stored; no control characters.
          examples: [Alice B.]
        interests:
          type: array
          description: |
            The complete new selection (replaces the current one; `[]` removes all). Codes of active
            interests only; unknown or inactive codes are rejected.
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Z][A-Z0-9_]*$'
            maxLength: 40

    UserProfile:
      type: object
      description: Profile of the signed-in user. Never contains the password or its hash.
      required: [id, email, displayName, role, interests, adultConfirmedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        interests:
          type: array
          description: |
            Codes of the selected interests in catalogue order (see `GET /api/v1/interests`). Only
            active interests are listed: a selected interest that is deactivated later disappears
            from the profile and is removed at the next change of the selection.
          items:
            type: string
            pattern: '^[A-Z][A-Z0-9_]*$'
            maxLength: 40
        adultConfirmedAt:
          type: string
          format: date-time
          description: When the user confirmed being at least 18 (server time, UTC)
        createdAt:
          type: string
          format: date-time

    UserRole:
      type: string
      description: |
        `PLAYER` for every registered user. `ADMIN` is never assigned through the API; the first
        administrator is created from environment configuration.
      enum: [PLAYER, ADMIN]

    Interest:
      type: object
      description: Educational interest from the catalog.
      required: [code, name, description]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          maxLength: 40
          examples: [PROBABILITY]
        name:
          type: string
          examples: [Probability & odds]
        description:
          type: string
          examples: [How likely outcomes are and how odds are expressed]

    Wallet:
      type: object
      description: Virtual-coin wallet of the signed-in player. Coins have no monetary value.
      required: [balance, updatedAt]
      properties:
        balance:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Current balance in whole virtual coins
          examples: [1000]
        updatedAt:
          type: string
          format: date-time
          description: When the balance last changed (UTC)

    WalletTransaction:
      type: object
      description: |
        One entry of the append-only wallet ledger. Entries are never changed or deleted. The sum of
        all `amount`s of a wallet equals its balance, and `balanceAfter` of the newest entry equals
        the current balance.
      required: [id, type, amount, balanceAfter, createdAt]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Entry id; higher ids are newer. Ids can have gaps.
          examples: [1]
        type:
          $ref: '#/components/schemas/WalletTransactionType'
        amount:
          type: integer
          format: int64
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Change in whole virtual coins; positive for a credit, negative for a debit, never `0`.
          examples: [1000]
        balanceAfter:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Balance right after this entry
          examples: [1000]
        createdAt:
          type: string
          format: date-time
          description: When the entry was recorded (UTC). Entries of one operation share it; order by `id`.

    WalletTransactionType:
      type: string
      description: |
        Reason for a ledger entry:

        | Value | Direction | Meaning |
        |---|---|---|
        | `STARTING_BALANCE` | credit | Starting coins, granted exactly once when the wallet is opened |
        | `ROULETTE_STAKE` | debit | Total stake of one roulette round (planned) |
        | `ROULETTE_PAYOUT` | credit | Total payout of one roulette round: stakes plus net winnings of its winning bets; only when something was won (planned) |

        A roulette round always has one `ROULETTE_STAKE` entry and, only if at least one bet won,
        one `ROULETTE_PAYOUT` entry. Values listed in `x-planned-enum-values` are designed but not
        returned yet. Later versions add values (for example learning rewards). Clients treat an
        unknown value as a generic entry and use the sign of `amount`.
      enum: [STARTING_BALANCE, ROULETTE_STAKE, ROULETTE_PAYOUT]
      x-planned-enum-values: [ROULETTE_STAKE, ROULETTE_PAYOUT]

    WalletTransactionPage:
      type: object
      description: One page of ledger entries, newest first.
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          description: At most `limit` entries, ordered by `id` descending. Empty for an empty wallet history.
          items:
            $ref: '#/components/schemas/WalletTransaction'
        nextCursor:
          type: [string, 'null']
          maxLength: 64
          pattern: '^[A-Za-z0-9_-]+$'
          description: |
            Opaque cursor for the next (older) page, passed back unchanged as `cursor`; `null` when
            this is the last page.

    RouletteSpinRequest:
      type: object
      description: |
        The bets of one roulette spin. Nothing else: the player comes from the session, and the
        result, the payouts and the balance are computed by the server. Properties not listed here
        are ignored.
      required: [bets]
      properties:
        bets:
          type: array
          minItems: 1
          maxItems: 10
          description: |
            1–10 bets with different selections (no category and option twice). Total stake:
            1–10,000 coins, at most the current balance.
          items:
            $ref: '#/components/schemas/RouletteBet'

    RouletteBet:
      type: object
      description: |
        One bet: a category, the one option property of that category, and the amount.

        | `category` | Option property | Allowed option values |
        |---|---|---|
        | `STRAIGHT` | `number` | an integer 0–36 |
        | `RED_BLACK` | `color` | `RED`, `BLACK` |
        | `EVEN_ODD` | `parity` | `EVEN`, `ODD` |
        | `LOW_HIGH` | `range` | `LOW` (1–18), `HIGH` (19–36) |
        | `DOZEN` | `dozen` | `FIRST` (1–12), `SECOND` (13–24), `THIRD` (25–36) |

        The option property of the bet's category is required; the other four option properties
        must be omitted (`null` counts as omitted). Otherwise `400 VALIDATION_FAILED` names the
        property, e.g. `bets[0].color`.
      required: [category, amount]
      properties:
        category:
          $ref: '#/components/schemas/RouletteBetCategory'
        number:
          type: integer
          format: int32
          minimum: 0
          maximum: 36
          description: The number of a `STRAIGHT` bet; only for `STRAIGHT`.
          examples: [17]
        color:
          $ref: '#/components/schemas/RouletteBetColor'
        parity:
          $ref: '#/components/schemas/RouletteParity'
        range:
          $ref: '#/components/schemas/RouletteRange'
        dozen:
          $ref: '#/components/schemas/RouletteDozen'
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000
          description: Stake of this bet in whole virtual coins, 1–1,000; a JSON integer without fraction or exponent.
          examples: [10]

    RouletteBetCategory:
      type: string
      description: |
        The five bet categories of European roulette. Zero wins only a `STRAIGHT` bet on `0`; it loses
        every other category.

        | Category | Covers | Probability of a win | Net winnings (odds) | Payout on a win (stake included) |
        |---|---|---|---|---|
        | `STRAIGHT` | the chosen number | 1/37 ≈ 2.7027 % | 35:1 | 36 × amount |
        | `RED_BLACK` | the 18 red or the 18 black numbers | 18/37 ≈ 48.6486 % | 1:1 | 2 × amount |
        | `EVEN_ODD` | 2, 4, …, 36 or 1, 3, …, 35 | 18/37 ≈ 48.6486 % | 1:1 | 2 × amount |
        | `LOW_HIGH` | 1–18 or 19–36 | 18/37 ≈ 48.6486 % | 1:1 | 2 × amount |
        | `DOZEN` | 1–12, 13–24 or 25–36 | 12/37 ≈ 32.4324 % | 2:1 | 3 × amount |

        A losing bet returns nothing. For every category the expected net result is −1/37 of the
        amount (house edge 1/37 ≈ 2.7027 %, return to player 36/37 ≈ 97.2973 %). Example, straight:
        35 × 1/37 − 1 × 36/37 = −1/37.
      enum: [STRAIGHT, RED_BLACK, EVEN_ODD, LOW_HIGH, DOZEN]

    RouletteBetColor:
      type: string
      description: |
        Option of a `RED_BLACK` bet. Red: 1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32,
        34, 36. Black: 2, 4, 6, 8, 10, 11, 13, 15, 17, 20, 22, 24, 26, 28, 29, 31, 33, 35. Zero (green)
        cannot be chosen.
      enum: [RED, BLACK]

    RouletteParity:
      type: string
      description: Option of an `EVEN_ODD` bet. Zero is neither even nor odd.
      enum: [EVEN, ODD]

    RouletteRange:
      type: string
      description: 'Option of a `LOW_HIGH` bet: `LOW` = 1–18, `HIGH` = 19–36. Zero is in neither.'
      enum: [LOW, HIGH]

    RouletteDozen:
      type: string
      description: 'Option of a `DOZEN` bet: `FIRST` = 1–12, `SECOND` = 13–24, `THIRD` = 25–36. Zero is in none.'
      enum: [FIRST, SECOND, THIRD]

    RouletteNumberColor:
      type: string
      description: Color of a winning number. `GREEN` only for 0.
      enum: [RED, BLACK, GREEN]

    RouletteSpinResult:
      type: object
      description: |
        Result of one roulette round, as stored by the server. The net change of the balance is
        `totalPayout − totalStake`.
      required: [roundId, winningNumber, winningColor, bets, totalStake, totalPayout, balance, createdAt]
      properties:
        roundId:
          type: string
          format: uuid
          description: Id of the round, generated by the server; the same for a replayed request.
        winningNumber:
          type: integer
          format: int32
          minimum: 0
          maximum: 36
          description: The number drawn by the server.
          examples: [17]
        winningColor:
          $ref: '#/components/schemas/RouletteNumberColor'
        bets:
          type: array
          minItems: 1
          maxItems: 10
          description: Every bet of the round with its payout, in the order of the original request.
          items:
            $ref: '#/components/schemas/RouletteSettledBet'
        totalStake:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000
          description: Sum of the bets' amounts, debited as one `ROULETTE_STAKE` ledger entry.
          examples: [30]
        totalPayout:
          type: integer
          format: int64
          minimum: 0
          maximum: 360000
          description: |
            Sum of the bets' payouts, credited as one `ROULETTE_PAYOUT` ledger entry; `0` when nothing
            was won (then there is no payout entry).
          examples: [360]
        balance:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Balance of the wallet right after this round (after the payout, if any).
          examples: [1330]
        createdAt:
          type: string
          format: date-time
          description: When the round was played (UTC).

    RouletteSettledBet:
      type: object
      description: |
        A bet of a played round: the selection as requested (the category and its one option
        property; the other option properties are omitted), the amount and the payout.
      required: [category, amount, payout]
      properties:
        category:
          $ref: '#/components/schemas/RouletteBetCategory'
        number:
          type: integer
          format: int32
          minimum: 0
          maximum: 36
          description: Only for `STRAIGHT`.
        color:
          $ref: '#/components/schemas/RouletteBetColor'
        parity:
          $ref: '#/components/schemas/RouletteParity'
        range:
          $ref: '#/components/schemas/RouletteRange'
        dozen:
          $ref: '#/components/schemas/RouletteDozen'
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000
          description: Stake of this bet in whole virtual coins.
        payout:
          type: integer
          format: int64
          minimum: 0
          maximum: 36000
          description: |
            Coins returned for this bet: on a win the stake plus the net winnings (36×, 2× or 3× the
            amount, see `RouletteBetCategory`), on a loss `0`. Net winnings of a winning bet =
            `payout − amount`.
          examples: [360]

    ProblemDetail:
      type: object
      description: |
        RFC 9457 Problem Details. Additional, error-specific members may be present at the top level.
      required: [title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI identifying the problem type; omitted for generic HTTP errors (`about:blank`).
        title:
          type: string
          description: Short, human-readable summary of the problem type
        status:
          type: integer
          format: int32
          description: HTTP status code
        detail:
          type: string
          description: Human-readable explanation of this occurrence
        instance:
          type: string
          format: uri-reference
          description: Request path where the problem occurred
        code:
          type: string
          description: |
            Stable, machine-readable error code. Clients decide on this value, never on `title` or
            `detail`. Every code comes with one fixed HTTP status, except the two generic fallbacks,
            which keep the status of an error that has no code of its own:

            | `code` | Status |
            |---|---|
            | `VALIDATION_FAILED`, `MALFORMED_REQUEST` | 400 |
            | `AUTHENTICATION_REQUIRED`, `SESSION_EXPIRED`, `INVALID_CREDENTIALS` | 401 |
            | `ACCESS_DENIED`, `CSRF_TOKEN_INVALID`, `REGISTRATION_DISABLED` | 403 |
            | `NOT_FOUND` | 404 |
            | `METHOD_NOT_ALLOWED` | 405 |
            | `NOT_ACCEPTABLE` | 406 |
            | `CONFLICT`, `EMAIL_ALREADY_REGISTERED`, `CONCURRENT_MODIFICATION`, `INSUFFICIENT_FUNDS`, `IDEMPOTENCY_KEY_REUSED`, `BALANCE_LIMIT_EXCEEDED` | 409 |
            | `CONTENT_TOO_LARGE` | 413 |
            | `UNSUPPORTED_MEDIA_TYPE` | 415 |
            | `TOO_MANY_ATTEMPTS` | 429 |
            | `INTERNAL_ERROR` | 500 |
            | `SERVICE_UNAVAILABLE` | 503 |
            | `CLIENT_ERROR` | any other `4xx` (e.g. 410, 422) |
            | `SERVER_ERROR` | any other `5xx` (e.g. 501, 502) |

            `CONFLICT` and `SERVICE_UNAVAILABLE` are generic; operations document their specific codes.
            The wallet codes `INSUFFICIENT_FUNDS` (debit larger than the balance),
            `IDEMPOTENCY_KEY_REUSED` (an operation key reused with different values) and
            `BALANCE_LIMIT_EXCEEDED` (a credit beyond 2^53 − 1) belong to balance-changing
            operations: they are returned by `POST /api/v1/games/roulette/spins` (planned); no
            implemented operation of this version returns them.
            New specific codes may be added in later versions, so clients treat an unknown code like
            the generic code of its status class.
          enum:
            - VALIDATION_FAILED
            - MALFORMED_REQUEST
            - AUTHENTICATION_REQUIRED
            - SESSION_EXPIRED
            - INVALID_CREDENTIALS
            - ACCESS_DENIED
            - CSRF_TOKEN_INVALID
            - REGISTRATION_DISABLED
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - NOT_ACCEPTABLE
            - CONFLICT
            - EMAIL_ALREADY_REGISTERED
            - CONCURRENT_MODIFICATION
            - INSUFFICIENT_FUNDS
            - IDEMPOTENCY_KEY_REUSED
            - BALANCE_LIMIT_EXCEEDED
            - CONTENT_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - TOO_MANY_ATTEMPTS
            - INTERNAL_ERROR
            - SERVICE_UNAVAILABLE
            - CLIENT_ERROR
            - SERVER_ERROR
        errors:
          type: array
          description: Invalid request properties, sorted by `field`; only present for `VALIDATION_FAILED`.
          items:
            $ref: '#/components/schemas/FieldError'
      additionalProperties: true

    FieldError:
      type: object
      description: One invalid request property. The rejected value is never included.
      required: [field, message]
      properties:
        field:
          type: string
          description: Name of the request property, e.g. `password`
        message:
          type: string
          description: What is wrong with the value

    HealthStatus:
      type: object
      description: Spring Boot Actuator health response.
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
        groups:
          type: array
          description: Names of the available health groups (aggregated endpoint only)
          items:
            type: string
