openapi: 3.1.0

# -----------------------------------------------------------------------------
# Online Casino Simulator — API contract (design-first).
#
# This file is the SOURCE OF TRUTH for the HTTP API:
#   1. Change the contract here first (new path, field, status code, ...).
#   2. Implement it in a controller + DTO.
#   3. `OpenApiContractIT` fails until the implementation matches the contract.
#
# Designed but not yet implemented operations and schema properties carry
# `x-implementation-status: planned` (operations also get the summary suffix "(planned)").
# The contract tests skip them while they are not implemented and fail as soon as an
# implementation exists, so the marker is removed in the same change as the implementation.
#
# Served at /openapi.yaml and shown first in Swagger UI (/swagger-ui.html).
# -----------------------------------------------------------------------------

info:
  title: Online Casino Simulator API
  version: 0.2.0
  summary: Casino rules and probabilities with virtual currency only.
  description: |
    REST API of the Online Casino Simulator.

    The platform uses **virtual currency only**: there are no real-money deposits,
    withdrawals, purchases of virtual currency or cash-equivalent prizes.

    ## Conventions
    - Base path for business endpoints: `/api/v1`; administrative endpoints will use `/api/v1/admin/**`.
    - Request and response bodies are JSON.
    - Errors are returned as [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) Problem Details
      (`application/problem+json`, schema `ProblemDetail`) with a stable `code` and
      `Cache-Control: no-store`. Clients decide on `code`, never on `title` or `detail`.
    - The following errors can occur on every operation and are not repeated per operation:
      unknown path `404 NOT_FOUND` (without a session, an unknown path under `/api/` returns
      `401 AUTHENTICATION_REQUIRED`, because access is denied by default), a missing or invalid
      CSRF token on an unsafe method `403 CSRF_TOKEN_INVALID`, unsupported method
      `405 METHOD_NOT_ALLOWED`, an `Accept` header that no representation matches
      `406 NOT_ACCEPTABLE`, an unsupported request `Content-Type`
      `415 UNSUPPORTED_MEDIA_TYPE`, an unreadable request `400 MALFORMED_REQUEST` and an unexpected
      failure `500 INTERNAL_ERROR`. Any other error status is kept and reported with a generic code
      (see `ProblemDetail.code`). Error responses never contain stack traces, exception messages,
      SQL or class names. Only a cross-origin request from an origin that is not allowed is
      rejected by the CORS check with a plain-text `403` (`Invalid CORS request`).
    - Timestamps are ISO-8601 in UTC (`date-time`).
    - Operations whose summary ends with "(planned)" (`x-implementation-status: planned`) are
      designed and reviewed, but not available yet.

    ## Authentication
    - Server-side sessions: registration and login set an `HttpOnly` session
      cookie (security scheme `sessionCookie`). There are no tokens in browser storage.
    - CSRF protection (security scheme `csrfHeader`): every `POST`, `PUT`, `PATCH` and `DELETE`
      request, including login and registration, sends the `XSRF-TOKEN` cookie value in the
      `X-XSRF-TOKEN` header. The token is obtained with `GET /api/v1/auth/csrf` at start-up and
      again after registration, login and logout. On `403` with code `CSRF_TOKEN_INVALID` the
      client fetches a new token and retries once.
    - Operations with `security: []` are public. All other operations require a session;
      without one they return `401 AUTHENTICATION_REQUIRED`, or `401 SESSION_EXPIRED` when the
      session cookie refers to a session that has ended.
  license:
    name: Proprietary — SAP mentorship project

servers:
  - url: /
    description: Same origin as the frontend (in development via the Vite proxy)

tags:
  - name: System
    description: Platform status
  - name: Authentication
    description: CSRF token, registration, login and logout
  - name: Users
    description: Profile of the signed-in user
  - name: Interests
    description: Catalog of educational interests
  - name: Operations
    description: Infrastructure health probes provided by Spring Boot Actuator

paths:
  /api/v1/system/status:
    get:
      tags: [System]
      operationId: getSystemStatus
      summary: Get platform status
      description: |
        Reports the application version and whether the database is reachable, including the
        latest applied database migration. Public, no authentication.
      security: []
      responses:
        '200':
          description: Platform is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
              example:
                application: online-casino-simulator
                version: 0.1.0-SNAPSHOT
                status: UP
                database:
                  status: UP
                  schemaVersion: '1'
                timestamp: '2026-10-29T10:15:30.123Z'
        '503':
          description: Platform is unavailable (database unreachable). The body still describes the status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
              example:
                application: online-casino-simulator
                version: 0.1.0-SNAPSHOT
                status: DOWN
                database:
                  status: DOWN
                  schemaVersion: null
                timestamp: '2026-10-29T10:15:30.123Z'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Issue a CSRF token
      description: |
        Sets the `XSRF-TOKEN` cookie, which JavaScript can read. Its value is sent
        in the `X-XSRF-TOKEN` header with every unsafe request. Call it at start-up and again after
        registration, login and logout, because these delete the `XSRF-TOKEN` cookie. Public.
      security: []
      responses:
        '204':
          description: Token cookie set
          headers:
            Set-Cookie:
              description: '`XSRF-TOKEN=<token>; Path=/` (readable by JavaScript; `Secure` over HTTPS)'
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Register a player account and sign in
      description: |
        Creates a `PLAYER` account and signs the new user in: a new session id is issued and the
        `XSRF-TOKEN` cookie is deleted, so the client fetches a new token with `GET /api/v1/auth/csrf`. The
        email is trimmed and lower-cased before it is checked and stored. `adultConfirmed` must be
        `true`; the confirmation time is taken from the server clock. Properties that are not in
        `RegisterRequest` (for example `role`) are ignored. All invalid properties are reported
        together in one `400 VALIDATION_FAILED`.

        Public, but requires a CSRF token. At most 10 registration attempts per client IP and hour:
        every request that passes the CSRF check counts, whatever its outcome (`201`, `400`, `409`).
        The limit is checked before the body is read, so a throttled client gets `429` even for an
        invalid request.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: alice@example.com
              password: correct-horse-battery
              displayName: Alice
              adultConfirmed: true
      responses:
        '201':
          description: Account created; the user is signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                id: 0b8f0c2e-5f3a-4c55-9d8e-2f6c1a7e9b10
                email: alice@example.com
                displayName: Alice
                role: PLAYER
                interests: []
                adultConfirmedAt: '2026-11-02T09:15:00Z'
                createdAt: '2026-11-02T09:15:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CsrfTokenInvalid'
        '409':
          description: The email is already registered
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                title: Conflict
                status: 409
                code: EMAIL_ALREADY_REGISTERED
                detail: An account with this email already exists.
                instance: /api/v1/auth/register
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Sign in
      description: |
        Signs the user in with email and password. The email is trimmed and lower-cased. On success
        a new session id is issued (session-fixation protection) and the `XSRF-TOKEN` cookie is
        deleted, so the client fetches a new token with `GET /api/v1/auth/csrf`. The session ends
        after 30 minutes of inactivity or 12 hours after sign-in.

        Every failure (unknown email, wrong password, disabled account) returns the same `401` with
        code `INVALID_CREDENTIALS`. Failed logins are throttled per account and client IP
        (5 per 15 minutes) and per client IP (50 per 15 minutes) with `429`; the limit is checked
        before the password, and the response is the same for existing and unknown accounts.
        Accounts are never locked; a successful login resets the account and IP counter. Public, but
        requires a CSRF token.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: alice@example.com
              password: correct-horse-battery
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Sign-in failed. The response does not reveal whether the account exists.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                title: Unauthorized
                status: 401
                code: INVALID_CREDENTIALS
                detail: The email or password is incorrect.
                instance: /api/v1/auth/login
        '403':
          $ref: '#/components/responses/CsrfTokenInvalid'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Sign out
      description: |
        Ends the session: the stored session is deleted, the session cookie expires and the
        `XSRF-TOKEN` cookie is deleted, so the client fetches a new token with
        `GET /api/v1/auth/csrf`. The old session cookie is rejected afterwards
        (`401 SESSION_EXPIRED`). Also returns `204` without a session (idempotent). Requires a CSRF
        token.
      security:
        - csrfHeader: []
      responses:
        '204':
          description: Signed out (or no session existed)
          headers:
            Set-Cookie:
              description: Expires the session cookie and the `XSRF-TOKEN` cookie
              schema:
                type: string
        '403':
          $ref: '#/components/responses/CsrfTokenInvalid'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get the signed-in user's profile
      description: |
        Returns the profile of the user who owns the session; the user is identified only by the
        session, never by a request value. The SPA also calls it at start-up to find out whether a
        user is signed in (`401` means anonymous). Does not extend the session's 12-hour lifetime.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Profile of the signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              example:
                id: 0b8f0c2e-5f3a-4c55-9d8e-2f6c1a7e9b10
                email: alice@example.com
                displayName: Alice
                role: PLAYER
                interests: [PROBABILITY, MATHEMATICS]
                adultConfirmedAt: '2026-11-02T09:15:00Z'
                createdAt: '2026-11-02T09:15:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Users]
      operationId: updateCurrentUser
      summary: Update the signed-in user's profile
      description: |
        Partial update of the signed-in user's display name and/or interests. Omitted properties are
        left unchanged, and so are properties sent as `null`; `{}` changes nothing.
        `interests` replaces the whole selection: 0–8 distinct codes of active interests
        (`GET /api/v1/interests`); an unknown or inactive code is reported as `VALIDATION_FAILED`
        for its position, e.g. `interests[2]`. Email, role, status and the 18+ confirmation cannot
        be changed: such properties are ignored. All changes are saved together or not at all.
        Requires a session and a CSRF token.

        A request that overlaps with another change of the same profile fails with
        `409 CONCURRENT_MODIFICATION` instead of overwriting it; the client reloads the profile and
        tries again. Requests that do not overlap are applied in order (the last one wins).
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              displayName: Alice B.
              interests: [PROBABILITY, STATISTICS]
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfTokenInvalid'
        '409':
          description: The profile was changed concurrently; reload it and try again
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                title: Conflict
                status: 409
                code: CONCURRENT_MODIFICATION
                detail: The profile was changed by another request. Reload it and try again.
                instance: /api/v1/users/me
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/interests:
    get:
      tags: [Interests]
      operationId: listInterests
      summary: List the educational interests
      description: |
        Active interests in display order (the order is stable; codes never change). Users choose
        0–8 of them in their profile. Public: works with and without a session, and creates none.
      security: []
      responses:
        '200':
          description: Active interests in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Interest'
              example:
                - code: PROBABILITY
                  name: Probability & odds
                  description: How likely outcomes are and how odds are expressed
                - code: MATHEMATICS
                  name: Mathematics of games
                  description: Expected value, house edge and variance
        '500':
          $ref: '#/components/responses/InternalError'

  /actuator/health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Aggregated health
      description: Health of the application including its health groups. Returns `503` when not healthy.
      security: []
      responses:
        '200':
          description: Application is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: UP
                groups: [liveness, readiness]
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Application is not healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /actuator/health/liveness:
    get:
      tags: [Operations]
      operationId: getLiveness
      summary: Liveness probe
      description: Whether the process is alive. Used by the hosting platform to restart the container.
      security: []
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: UP
        '503':
          description: Not alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /actuator/health/readiness:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Readiness probe
      description: Whether the application is ready to accept traffic.
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: UP
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /actuator/info:
    get:
      tags: [Operations]
      operationId: getInfo
      summary: Application info
      description: Build and application information (currently empty).
      security: []
      responses:
        '200':
          description: Application info
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example: {}

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: |
        Server-side session (Spring Session JDBC). The cookie is `HttpOnly`, `SameSite=Lax`, `Path=/`
        and has no `Domain`. In production it is named `__Host-SESSION` and is `Secure`. Issued by
        registration and login; it ends with logout, after 30 minutes of inactivity or
        12 hours after sign-in. The browser sends it automatically. A request whose
        session has ended gets `401 SESSION_EXPIRED` on protected operations.
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: |
        CSRF token (Spring Security SPA pattern): the value of the `XSRF-TOKEN` cookie from
        `GET /api/v1/auth/csrf`, sent with every `POST`, `PUT`, `PATCH` and `DELETE`. It is checked
        on every unsafe request, including public ones; without it the response is
        `403 CSRF_TOKEN_INVALID`.

  headers:
    NoStore:
      description: |
        Contains `no-store`, so errors and personal data are never cached. Error responses send
        `no-store`; other responses get Spring Security's default.
      schema:
        type: string
        examples: ['no-store', 'no-cache, no-store, max-age=0, must-revalidate']
    SessionCookie:
      description: |
        Session cookie with a new session id, e.g. `SESSION=<id>; Path=/; HttpOnly; SameSite=Lax`
        (`__Host-SESSION=<id>; Path=/; Secure; HttpOnly; SameSite=Lax` in production).
      schema:
        type: string
    RetryAfter:
      description: Seconds until the current throttling window ends.
      schema:
        type: integer
        format: int32
        minimum: 1

  responses:
    InternalError:
      description: Unexpected error; the details are only logged on the server
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            title: Internal Server Error
            status: 500
            code: INTERNAL_ERROR
            detail: An unexpected error occurred. Please try again later.
            instance: /api/v1/system/status
    BadRequest:
      description: |
        The request is invalid. `VALIDATION_FAILED` lists the invalid properties in `errors` (rejected
        values are never echoed); `MALFORMED_REQUEST` means the request could not be read (malformed
        JSON, a wrong JSON type, a missing body or an invalid parameter).
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            validationFailed:
              value:
                title: Bad Request
                status: 400
                code: VALIDATION_FAILED
                detail: The request contains invalid values.
                instance: /api/v1/auth/register
                errors:
                  - field: password
                    message: must be at least 12 characters long
                  - field: adultConfirmed
                    message: must be true
            malformedRequest:
              value:
                title: Bad Request
                status: 400
                code: MALFORMED_REQUEST
                detail: The request could not be read.
                instance: /api/v1/auth/register
    Unauthenticated:
      description: |
        No valid session. `AUTHENTICATION_REQUIRED`: the request had no session cookie.
        `SESSION_EXPIRED`: the session cookie refers to a session that has ended (inactivity, maximum
        lifetime or logout).
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            authenticationRequired:
              value:
                title: Unauthorized
                status: 401
                code: AUTHENTICATION_REQUIRED
                detail: Sign in to continue.
                instance: /api/v1/users/me
            sessionExpired:
              value:
                title: Unauthorized
                status: 401
                code: SESSION_EXPIRED
                detail: Your session has ended. Sign in again.
                instance: /api/v1/users/me
    CsrfTokenInvalid:
      description: The `X-XSRF-TOKEN` header is missing or does not match the `XSRF-TOKEN` cookie.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            title: Forbidden
            status: 403
            code: CSRF_TOKEN_INVALID
            detail: The CSRF token is missing or invalid.
            instance: /api/v1/auth/login
    TooManyAttempts:
      description: Too many attempts from this client; try again after `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            title: Too Many Requests
            status: 429
            code: TOO_MANY_ATTEMPTS
            detail: Too many attempts. Try again later.
            instance: /api/v1/auth/login

  schemas:
    ComponentStatus:
      type: string
      description: Availability of the platform or one of its dependencies.
      enum: [UP, DOWN]

    SystemStatus:
      type: object
      description: Platform status and database connectivity.
      required: [application, version, status, database, timestamp]
      properties:
        application:
          type: string
          description: Application name
          examples: [online-casino-simulator]
        version:
          type: string
          description: Application version
          examples: [0.1.0-SNAPSHOT]
        status:
          $ref: '#/components/schemas/ComponentStatus'
        database:
          $ref: '#/components/schemas/DatabaseStatus'
        timestamp:
          type: string
          format: date-time
          description: Time the status was determined (UTC)

    DatabaseStatus:
      type: object
      required: [status, schemaVersion]
      properties:
        status:
          $ref: '#/components/schemas/ComponentStatus'
        schemaVersion:
          type: [string, 'null']
          description: Latest applied Flyway migration version; `null` when the database is unreachable.
          examples: ['1']

    RegisterRequest:
      type: object
      description: New player account. Properties not listed here are ignored.
      required: [email, password, displayName, adultConfirmed]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: |
            Trimmed and lower-cased by the server before it is checked and stored. Only ASCII
            characters are accepted.
          examples: [alice@example.com]
        password:
          type: string
          minLength: 12
          maxLength: 72
          writeOnly: true
          description: |
            At least 12 characters and at most 72 bytes in UTF-8 (longer passwords are rejected,
            never truncated). Must not equal the email or the display name (ignoring case). Stored
            only as a BCrypt hash.
        displayName:
          type: string
          minLength: 3
          maxLength: 30
          description: Trimmed by the server before it is checked and stored; no control characters.
          examples: [Alice]
        adultConfirmed:
          type: boolean
          description: Confirms that the user is at least 18 years old. Must be `true`.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
          examples: [alice@example.com]
        password:
          type: string
          minLength: 1
          writeOnly: true

    UpdateProfileRequest:
      type: object
      description: |
        Partial profile update. Omitted properties and properties sent as `null` are left
        unchanged; `null` never clears a value. Properties not listed here (for example `email` or
        `role`) are ignored.
      properties:
        displayName:
          type: string
          minLength: 3
          maxLength: 30
          description: Trimmed by the server before it is checked and stored; no control characters.
          examples: [Alice B.]
        interests:
          type: array
          description: |
            The complete new selection (replaces the current one; `[]` removes all). Codes of active
            interests only; unknown or inactive codes are rejected.
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Z][A-Z0-9_]*$'
            maxLength: 40

    UserProfile:
      type: object
      description: Profile of the signed-in user. Never contains the password or its hash.
      required: [id, email, displayName, role, interests, adultConfirmedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        interests:
          type: array
          description: |
            Codes of the selected interests in catalogue order (see `GET /api/v1/interests`). Only
            active interests are listed: a selected interest that is deactivated later disappears
            from the profile and is removed at the next change of the selection.
          items:
            type: string
            pattern: '^[A-Z][A-Z0-9_]*$'
            maxLength: 40
        adultConfirmedAt:
          type: string
          format: date-time
          description: When the user confirmed being at least 18 (server time, UTC)
        createdAt:
          type: string
          format: date-time

    UserRole:
      type: string
      description: |
        `PLAYER` for every registered user. `ADMIN` is never assigned through the API; the first
        administrator is created from environment configuration.
      enum: [PLAYER, ADMIN]

    Interest:
      type: object
      description: Educational interest from the catalog.
      required: [code, name, description]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          maxLength: 40
          examples: [PROBABILITY]
        name:
          type: string
          examples: [Probability & odds]
        description:
          type: string
          examples: [How likely outcomes are and how odds are expressed]

    ProblemDetail:
      type: object
      description: |
        RFC 9457 Problem Details. Additional, error-specific members may be present at the top level.
      required: [title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI identifying the problem type; omitted for generic HTTP errors (`about:blank`).
        title:
          type: string
          description: Short, human-readable summary of the problem type
        status:
          type: integer
          format: int32
          description: HTTP status code
        detail:
          type: string
          description: Human-readable explanation of this occurrence
        instance:
          type: string
          format: uri-reference
          description: Request path where the problem occurred
        code:
          type: string
          description: |
            Stable, machine-readable error code. Clients decide on this value, never on `title` or
            `detail`. Every code comes with one fixed HTTP status, except the two generic fallbacks,
            which keep the status of an error that has no code of its own:

            | `code` | Status |
            |---|---|
            | `VALIDATION_FAILED`, `MALFORMED_REQUEST` | 400 |
            | `AUTHENTICATION_REQUIRED`, `SESSION_EXPIRED`, `INVALID_CREDENTIALS` | 401 |
            | `ACCESS_DENIED`, `CSRF_TOKEN_INVALID` | 403 |
            | `NOT_FOUND` | 404 |
            | `METHOD_NOT_ALLOWED` | 405 |
            | `NOT_ACCEPTABLE` | 406 |
            | `CONFLICT`, `EMAIL_ALREADY_REGISTERED`, `CONCURRENT_MODIFICATION` | 409 |
            | `CONTENT_TOO_LARGE` | 413 |
            | `UNSUPPORTED_MEDIA_TYPE` | 415 |
            | `TOO_MANY_ATTEMPTS` | 429 |
            | `INTERNAL_ERROR` | 500 |
            | `SERVICE_UNAVAILABLE` | 503 |
            | `CLIENT_ERROR` | any other `4xx` (e.g. 410, 422) |
            | `SERVER_ERROR` | any other `5xx` (e.g. 501, 502) |

            `CONFLICT` and `SERVICE_UNAVAILABLE` are generic; operations document their specific codes.
            New specific codes may be added in later versions, so clients treat an unknown code like
            the generic code of its status class.
          enum:
            - VALIDATION_FAILED
            - MALFORMED_REQUEST
            - AUTHENTICATION_REQUIRED
            - SESSION_EXPIRED
            - INVALID_CREDENTIALS
            - ACCESS_DENIED
            - CSRF_TOKEN_INVALID
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - NOT_ACCEPTABLE
            - CONFLICT
            - EMAIL_ALREADY_REGISTERED
            - CONCURRENT_MODIFICATION
            - CONTENT_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - TOO_MANY_ATTEMPTS
            - INTERNAL_ERROR
            - SERVICE_UNAVAILABLE
            - CLIENT_ERROR
            - SERVER_ERROR
        errors:
          type: array
          description: Invalid request properties, sorted by `field`; only present for `VALIDATION_FAILED`.
          items:
            $ref: '#/components/schemas/FieldError'
      additionalProperties: true

    FieldError:
      type: object
      description: One invalid request property. The rejected value is never included.
      required: [field, message]
      properties:
        field:
          type: string
          description: Name of the request property, e.g. `password`
        message:
          type: string
          description: What is wrong with the value

    HealthStatus:
      type: object
      description: Spring Boot Actuator health response.
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
        groups:
          type: array
          description: Names of the available health groups (aggregated endpoint only)
          items:
            type: string
