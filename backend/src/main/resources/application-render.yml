# Public deployment behind Render's HTTPS proxy (profile `render`), together with the database
# profile: SPRING_PROFILES_ACTIVE=neon,render. Only what differs from a local run; secrets and
# deployment-specific values stay environment variables. Runbook: infrastructure/render/README.md.
server:
  # Render routes public traffic to $PORT (default 10000). The address is Spring Boot's default,
  # all interfaces (0.0.0.0).
  port: ${PORT:8080}
  # Forwarded headers (X-Forwarded-*, Forwarded) are ignored: the address of Render's proxy is not
  # documented, and on the first deployment trusting 10.0.0.0/8 had no effect (no HTTPS detected).
  # Render does not strip a client-supplied X-Forwarded-For, so trusting a guessed range would let
  # clients choose the address that throttling uses. The client address is therefore the proxy's
  # (shared by all clients) until the proxy chain has been verified from Render's logs; then
  # SERVER_FORWARD_HEADERS_STRATEGY=native with an exact SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES
  # (infrastructure/render/README.md, "Client address").
  forward-headers-strategy: none
  tomcat:
    threads:
      # Fewer request threads (default 200) for a 512 MB instance; each one has its own stack.
      max: 50
  servlet:
    session:
      cookie:
        # HTTPS only: the `__Host-` prefix requires Secure, Path=/ and no Domain (ADR-0006).
        name: __Host-SESSION
        secure: true
        same-site: lax

spring:
  lifecycle:
    # Render stops an instance with SIGTERM and kills it 30 s later: finish requests before that.
    timeout-per-shutdown-phase: 20s

app:
  security:
    # Render terminates TLS and redirects plain HTTP before forwarding, so every request was HTTPS for
    # the browser even though it arrives here as HTTP: HSTS on every response and a Secure CSRF
    # cookie, without relying on forwarded headers.
    https-only: true
  registration:
    # Closed on a public deployment unless APP_REGISTRATION_ENABLED=true is set on purpose, after the
    # deployment has been verified.
    enabled: ${APP_REGISTRATION_ENABLED:false}
  cors:
    # No browser origin is allowed until a frontend exists. Then set APP_CORS_ALLOWED_ORIGINS to its
    # exact HTTPS origin. Never localhost on a public deployment. Also needed behind the Vercel
    # rewrite (frontend/vercel.json): the browser sends its Origin on unsafe requests, and the Host
    # here is Render's, so login and logout are CORS requests (VercelProxyIT).
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

springdoc:
  # The generated API description and Swagger UI are development tools; the design-first contract
  # (/openapi.yaml) stays available.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
