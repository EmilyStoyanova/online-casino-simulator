# Local development infrastructure.
# Usage:  docker compose up -d        (requires a `.env` file — see .env.example)
#         docker compose down          (stop; data is kept in the named volume)
#         docker compose down -v       (stop AND delete local database data)
name: online-casino-simulator

services:
  postgres:
    # Pinned to the PostgreSQL major version offered by the production host (Neon).
    image: postgres:17.11-alpine
    container_name: casino-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      # Bound to localhost only, so the database is not exposed to the local network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
